<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<canvas id="stage" width="600" height="600"></canvas><canvas id="stageGL" width="10" height="10" hidden></canvas>
<pre id="o">-</pre>
<script type="module">
const o=document.getElementById('o');
try{
 const {mapB}=await import('./src/mapping.js');
 const {drawB}=await import('./src/styleB.js');
 const st={activation:.4,stability:.9,complexity:.4,change:.08,focus:.65,quality:.9,time:0};
 const pr=mapB(st); pr.motif='tuanhua';
 const g=document.getElementById('stage').getContext('2d');
 drawB(g,600,600,st,pr,1.0,20261028);
 o.textContent='OK';
}catch(e){o.textContent='FAIL '+e.stack.slice(0,400);}
</script></body></html>
