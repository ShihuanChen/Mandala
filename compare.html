<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双风格对照 · 脑机新中式视觉</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header class="compare-head">
  <div class="t">
    <h1>双风格对照</h1>
    <span>同一份状态输入 · 两条审美路线</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="chips inline" id="cPresets">
      <button data-v="calm" class="on">安静</button>
      <button data-v="active">展开</button>
      <button data-v="focused">集中</button>
      <button data-v="unstable">波动</button>
    </div>
    <button id="cPlay" class="btn">暂停</button>
    <button id="cPngB" class="btn ghost">导出左</button>
    <button id="cPngA" class="btn ghost">导出右</button>
    <a class="link" href="index.html">返回 →</a>
  </div>
</header>

<div class="compare-body">
  <div class="pane light" id="paneB">
    <canvas id="cvB"></canvas>
    <div class="tag">简约典雅 · 圆形花卉</div>
    <div class="cap"><small>风格 B</small><span id="capB">纹样正在安静下来</span></div>
  </div>
  <div class="pane" id="paneA">
    <canvas id="cvA"></canvas>
    <div class="tag">材质对比 · 酸性新中式</div>
    <div class="cap"><small>风格 A</small><span id="capA">纹样正在安静下来</span></div>
  </div>
</div>

<script type="module" src="src/compare.js"></script>
</body>
</html>
