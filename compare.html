<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三版对照 · 脑机新中式视觉</title>
<link rel="stylesheet" href="src/styles.css?v=0.5">
</head>
<body>
<header class="compare-head">
  <div class="t">
    <h1>三版对照</h1>
    <span>同一张曼陀罗 · 三种形式语言与质感</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="chips inline" id="cPresets">
      <button data-v="calm" class="on">安静</button>
      <button data-v="active">展开</button>
      <button data-v="focused">集中</button>
      <button data-v="unstable">波动</button>
    </div>
    <button id="cPlay" class="btn">暂停</button>
    <button id="cPng1" class="btn ghost">导出 平涂</button>
    <button id="cPng2" class="btn ghost">导出 叠影</button>
    <button id="cPng3" class="btn ghost">导出 折光</button>
    <a class="link" href="index.html">返回 →</a>
  </div>
</header>

<div class="compare-body three">
  <div class="pane light" id="pane1">
    <canvas id="cv1"></canvas>
    <div class="tag">一 · 平涂 · 绢本（色块 / 退晕台阶 / 盘金 / 丝理）</div>
    <div class="cap"><small>silk</small><span id="cap1">纹样正在安静下来</span></div>
  </div>
  <div class="pane light" id="pane2">
    <canvas id="cv2"></canvas>
    <div class="tag">二 · 叠影 · 套印（多层错位 / 半透 / 重影轮廓）</div>
    <div class="cap"><small>lacquer</small><span id="cap2">纹样正在安静下来</span></div>
  </div>
  <div class="pane" id="pane3">
    <canvas id="cv3"></canvas>
    <div class="tag">三 · 折光 · 琉璃（折射 / 色散 / 菲涅尔亮边）</div>
    <div class="cap"><small>glass</small><span id="cap3">纹样正在安静下来</span></div>
  </div>
</div>

<script type="module" src="src/compare.js"></script>
</body>
</html>
