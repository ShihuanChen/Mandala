<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脑机京绣 · 原型 0.4</title>
<link rel="stylesheet" href="src/styles.css?v=0.4">
</head>
<body>
<div class="app">

  <aside class="panel left">
    <div class="brand">
      <div class="brand-mark">曼</div>
      <div>
        <h1>脑机新中式视觉</h1>
        <p>BCI × 京绣 · Prototype 0.4</p>
      </div>
    </div>

    <section>
      <h2>输入模式</h2>
      <div class="seg" id="modeSeg">
        <button data-v="sim" class="on">模拟</button>
        <button data-v="manual">手动</button>
        <button data-v="realtime">实时</button>
      </div>
      <div class="hint" id="wsHint">实时模式需先启动 WebSocket 服务（见 README）。</div>
    </section>

    <section>
      <h2>视觉风格</h2>
      <div class="seg" id="styleSeg">
        <button data-v="B" class="on">京绣·团花</button>
        <button data-v="B2">京绣·满地</button>
        <button data-v="A">点翠·琉璃</button>
      </div>
      <a class="link" href="compare.html" target="_blank" rel="noopener">打开三版对照 →</a>
    </section>

    <section>
      <h2>状态预设</h2>
      <div class="chips" id="presetChips">
        <button data-v="calm" class="on">安静</button>
        <button data-v="active">展开</button>
        <button data-v="focused">集中</button>
        <button data-v="unstable">波动</button>
      </div>
    </section>

    <section id="motifSection">
      <h2>纹样母题</h2>
      <select id="motifSelect">
        <option value="auto">跟随状态</option>
        <option value="tuanhua">宝相团花</option>
        <option value="mudan">缠枝牡丹</option>
        <option value="fenghuang">凤凰羽</option>
        <option value="haishui">海水江崖</option>
        <option value="dazi">打籽团</option>
      </select>
    </section>

    <section>
      <h2>播放</h2>
      <div class="row">
        <button id="btnPlay" class="btn wide">暂停</button>
        <button id="btnReset" class="btn ghost">重置</button>
      </div>
    </section>

    <div class="foot">
      参数化原型 · 状态只驱动视觉语法，不宣称情绪识别或疗愈。<br>
      同一份状态输入可切换两条审美路线做对照。
    </div>
  </aside>

  <main class="stage" id="stageWrap">
    <canvas id="stage"></canvas>
    <canvas id="stageGL" hidden></canvas>
    <div class="signal" id="signal">信号良好</div>
    <div class="caption">
      <div class="cap-style" id="capStyle">典雅 · 同心平涂</div>
      <div class="cap-line" id="capLine">纹样正在安静下来</div>
    </div>
  </main>

  <aside class="panel right">
    <section>
      <h2>状态</h2>
      <div id="bars"></div>
      <div class="hint" id="manualHint" hidden>切到「手动」可直接拖动滑块。</div>
    </section>

    <section>
      <h2>当前映射参数</h2>
      <div class="params" id="params"></div>
    </section>

    <section>
      <h2>导出</h2>
      <div class="grid2">
        <button id="btnPng" class="btn primary">导出 PNG</button>
        <button id="btnJson" class="btn">导出 JSON</button>
        <button id="btnSession" class="btn ghost">保存会话</button>
        <button id="btnReplay" class="btn ghost">回放上一段</button>
      </div>
      <button id="btnDrop" class="btn ghost tiny">模拟断流 3 秒</button>
    </section>
  </aside>

</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
